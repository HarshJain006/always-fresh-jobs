# Netlify hosts the frontend + light server functions (enqueue only — no Chrome/Selenium).
# Selenium runs on the Raspberry Pi via `npm run worker`.

[build]
  command = "npm run build"
  publish = "dist/client"
  # @netlify/vite-plugin-tanstack-start emits browser assets to dist/client
  # and wires the SSR server entry into a Netlify Function automatically.

[build.environment]
  NODE_VERSION = "22"

# Optional: hit this from Netlify Scheduled Functions / external cron at 8 AM IST
# Headers: x-cron-secret: <CRON_SECRET>
# /api/cron/daily-refresh — enqueues resume jobs into Supabase
# /api/cron/reminders    — sends trial/subscription expiry emails (run daily)

# PWA installability — correct MIME + no stale SW/manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/pwa-icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
